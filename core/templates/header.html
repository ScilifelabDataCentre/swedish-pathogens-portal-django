{% load static %}

<div class="header">

  <!-- Logo -->
  <div class="container my-4 flex flex-wrap items-center gap-6">
    <a href="/" class="no-underline">
      <img class="h-15 inline" src="{% static 'images/swe_pathogens_logo.svg' %}" alt="Pathogens Portal Sweden">
    </a>
    <a href="https://www.scilifelab.se">
      <img class="h-13 inline" src="{% static 'images/SciLifeLab_logo.svg' %}" alt="SciLifeLab Home">
    </a>
  </div>

  <!-- Primary navigation -->
  <nav class="border-y border-slate-200 bg-white">
    <div class="container">
      <ul class="flex flex-wrap items-center gap-1 py-2 text-sm font-medium">

        <!-- Home -->
        <li>
          <a class="block rounded px-3 py-2 hover:bg-slate-100" href="/">
            Home
          </a>
        </li>

        <!-- Data -->
        <li class="relative">
          <details class="group"  data-nav-dropdown="top">
            <summary class="list-none cursor-pointer select-none rounded px-3 py-2 hover:bg-slate-100 flex items-center gap-2">
              <span>Data</span>
              <span class="text-xs opacity-70 group-open:rotate-180 transition-transform">▾</span>
            </summary>

            <div class="absolute left-0 z-50 mt-2 w-72 rounded-lg border border-slate-200 bg-white shadow-lg">
              <ul class="p-2">
                <li>
                  <a class="block rounded px-3 py-2 hover:bg-slate-100" href="/data-management/">
                    Data management
                  </a>
                </li>
                <li>
                  <a class="block rounded px-3 py-2 hover:bg-slate-100" href="/dashboards/">
                    Dashboards
                  </a>
                </li>
                <li>
                  <a class="block rounded px-3 py-2 hover:bg-slate-100" href="/register-based-research/">
                    Register-based research
                  </a>
                </li>
              </ul>
            </div>
          </details>
        </li>

        <!-- Explore -->
        <li class="relative">
          <details class="group"  data-nav-dropdown="top">
            <summary class="list-none cursor-pointer select-none rounded px-3 py-2 hover:bg-slate-100 flex items-center gap-2">
              <span>Explore</span>
              <span class="text-xs opacity-70 group-open:rotate-180 transition-transform">▾</span>
            </summary>

            <div class="absolute left-0 z-50 mt-2 w-72 rounded-lg border border-slate-200 bg-white shadow-lg">
              <ul class="p-2">
                <li>
                  <a class="block rounded px-3 py-2 hover:bg-slate-100" href="/outbreaks/">
                    Outbreaks
                  </a>
                </li>
                <li>
                  <a class="block rounded px-3 py-2 hover:bg-slate-100" href="/topics/">
                    Topics
                  </a>
                </li>
                <li>
                  <a class="block rounded px-3 py-2 hover:bg-slate-100" href="/articles/">
                    Articles
                  </a>
                </li>
                <li>
                  <a class="block rounded px-3 py-2 hover:bg-slate-100" href="/news/">
                    News
                  </a>
                </li>
              </ul>
            </div>
          </details>
        </li>

      
      

      </ul>
    </div>
  </nav>

  <!-- Banner and text -->
  <div class="bg-cover bg-center bg-no-repeat py-4"
       style="background-image: linear-gradient(
              to bottom, rgba(55, 174, 148, 0.52), rgba(55, 174, 148, 0.73)),
              url('{% static 'images/csm_coronavirus_mc.jpg' %}');">
    <div class="container">
      <span class="text-3xl font-medium">
        {% if title %}
          {{ title }}
        {% else %}
          Swedish Pathogens Portal
        {% endif %}
      </span>
    </div>
  </div>

</div>




<script>
  (function () {
    const nav = document.querySelector("nav");
    if (!nav) return;

    const selector = 'details[data-nav-dropdown="top"]';
    const dropdowns = Array.from(nav.querySelectorAll(selector));

    function closeAll(except) {
      dropdowns.forEach((d) => {
        if (d !== except) d.open = false;
      });
    }

    // When one opens, close the others
    nav.addEventListener(
      "toggle",
      (e) => {
        const target = e.target;
        if (!(target instanceof HTMLDetailsElement)) return;
        if (!target.matches(selector)) return;
        if (!target.open) return;

        closeAll(target);
      },
      true 
    );

    // Close when clicking outside the nav
    document.addEventListener("pointerdown", (e) => {
      const clickedInsideNav = nav.contains(e.target);
      if (!clickedInsideNav) closeAll();
    });

    // Close when pressing Escape
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeAll();
    });
  })();
</script>
