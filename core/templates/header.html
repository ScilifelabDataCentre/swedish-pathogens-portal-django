{% load static %}

<div class="header">

  <!-- Top bar: Logos (left) + Menu (right) --> 
  <div class="border-b border-slate-200 bg-pp-pale-grey text-black">
    <div class="container py-4 flex flex-wrap items-center gap-6 ">

      <!-- Logos (left) -->
      <div class="flex flex-wrap items-center gap-6">
        <a href="/" class="no-underline">
          <img class="h-15 inline" src="{% static 'images/swe_pathogens_logo_transparent.svg' %}" alt="Pathogens Portal Sweden">
        </a>
        <a href="https://www.scilifelab.se">
          <img class="h-13 inline" src="{% static 'images/SciLifeLab_logo.svg' %}" alt="SciLifeLab Home">
        </a>
      </div>

      <!-- Menu (right) -->
      <nav class="ml-auto" aria-label="Main navigation">
        <ul class="flex flex-wrap items-center justify-end gap-1 py-2 text-sm font-medium">

          <!-- Research Data Management -->
          <li class="relative">
            <details class="group" data-nav-dropdown="top">
              <summary class="list-none cursor-pointer select-none rounded px-3 py-2 hover:bg-slate-100 flex items-center gap-2">
                <span>Research Data Management </span>
                <span class="text-xs opacity-70 group-open:rotate-180 transition-transform">▾</span>
              </summary>
              <div class="absolute right-0 z-50 mt-2 w-72 rounded-lg border border-slate-200 bg-white shadow-lg">
                <ul class="p-2">
                  <li><a class="block rounded px-3 py-2 hover:bg-slate-100 " href="/data-management/">Data management</a></li>
                  <li><a class="block rounded px-3 py-2 hover:bg-slate-100" href="/dashboards/">Dashboards</a></li>
                  <li><a class="block rounded px-3 py-2 hover:bg-slate-100" href="/register-based-research/">Register-based research</a></li>
                  <li><a class="block rounded px-3 py-2 hover:bg-slate-100" href="/articles/">Articles</a></li>
                  <li><a class="block rounded px-3 py-2 hover:bg-slate-100" href="/news/">News</a></li>
                </ul>
              </div>
            </details>
          </li>
           <!-- Outbreaks -->
          <li>
            <a class="block rounded px-3 py-2 hover:bg-slate-100 text-black" href="/outbreaks/">
              Outbreaks
            </a>
          </li>
          <!-- Topics -->
          <li>
            <a class="block rounded px-3 py-2 hover:bg-slate-100 text-black" href="/topics/">
              Topics
            </a>
          </li>


        </ul>
      </nav>

    </div>
  </div>

</div>

<!-- Dropdown behavior -->
<script>
  (function () {
    const nav = document.querySelector('nav[aria-label="Main navigation"]');
    if (!nav) return;

    const selector = 'details[data-nav-dropdown="top"]';
    const dropdowns = Array.from(nav.querySelectorAll(selector));

    function closeAll(except) {
      dropdowns.forEach((d) => {
        if (d !== except) d.open = false;
      });
    }

    nav.addEventListener(
      "toggle",
      (e) => {
        const target = e.target;
        if (!(target instanceof HTMLDetailsElement)) return;
        if (!target.matches(selector)) return;
        if (!target.open) return;
        closeAll(target);
      },
      true
    );

    document.addEventListener("pointerdown", (e) => {
      if (!nav.contains(e.target)) closeAll();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeAll();
    });
  })();
</script>
