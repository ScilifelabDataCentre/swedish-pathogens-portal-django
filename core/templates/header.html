{% load static %}

<header class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
    <div class="container mx-auto px-6 max-w-7xl">
        <div class="flex items-center justify-between h-20">
            <!-- Logos -->
            <div class="flex items-center gap-6">
                <a href="{% url 'home:index' %}" class="flex items-center">
                    <img src="{% static 'images/swe_pathogens_logo.svg' %}" alt="Swedish Pathogens Portal" class="h-12">
                </a>
                <div class="h-10 w-px bg-gray-300"></div>
                <a href="https://www.scilifelab.se/" target="_blank" rel="noopener" class="flex items-center">
                    <img src="{% static 'images/SciLifeLab_logo.svg' %}" alt="SciLifeLab" class="h-10">
                </a>
            </div>

            <!-- Navigation -->
            <nav class="hidden lg:flex items-center gap-8">
                <!-- Data Dropdown -->
                <div class="relative group">
                    <button
                        class="flex items-center gap-1 text-pp-dark-blue font-medium hover:text-pp-teal transition-colors py-2">
                        Data
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7">
                            </path>
                        </svg>
                    </button>
                    <div
                        class="absolute left-0 mt-2 w-56 bg-white border border-gray-200 rounded-lg shadow-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all">
                        <a href="{% url 'dashboards:index' %}"
                            class="block px-4 py-3 text-pp-dark-blue hover:bg-pp-pale-grey hover:text-pp-teal transition-colors">Dashboards</a>
                        <a href="{% url 'topics:index' %}"
                            class="block px-4 py-3 text-pp-dark-blue hover:bg-pp-pale-grey hover:text-pp-teal transition-colors">Topics</a>
                        <a href="{% url 'articles:index' %}"
                            class="block px-4 py-3 text-pp-dark-blue hover:bg-pp-pale-grey hover:text-pp-teal transition-colors">Publications</a>
                    </div>
                </div>

                <!-- Resources Dropdown -->
                <div class="relative group">
                    <button
                        class="flex items-center gap-1 text-pp-dark-blue font-medium hover:text-pp-teal transition-colors py-2">
                        Resources
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7">
                            </path>
                        </svg>
                    </button>
                    <div
                        class="absolute left-0 mt-2 w-56 bg-white border border-gray-200 rounded-lg shadow-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all">
                        <a href="#"
                            class="block px-4 py-3 text-pp-dark-blue hover:bg-pp-pale-grey hover:text-pp-teal transition-colors">Biobanks</a>
                        <a href="#"
                            class="block px-4 py-3 text-pp-dark-blue hover:bg-pp-pale-grey hover:text-pp-teal transition-colors">Guidelines</a>
                        <a href="#"
                            class="block px-4 py-3 text-pp-dark-blue hover:bg-pp-pale-grey hover:text-pp-teal transition-colors">Events
                            & Training</a>
                        <a href="#"
                            class="block px-4 py-3 text-pp-dark-blue hover:bg-pp-pale-grey hover:text-pp-teal transition-colors">Funding
                            Opportunities</a>
                    </div>
                </div>

                <!-- Research Dropdown -->
                <div class="relative group">
                    <button
                        class="flex items-center gap-1 text-pp-dark-blue font-medium hover:text-pp-teal transition-colors py-2">
                        Research
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7">
                            </path>
                        </svg>
                    </button>
                    <div
                        class="absolute left-0 mt-2 w-56 bg-white border border-gray-200 rounded-lg shadow-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all">
                        <a href="#"
                            class="block px-4 py-3 text-pp-dark-blue hover:bg-pp-pale-grey hover:text-pp-teal transition-colors">Pandemic
                            Preparedness</a>
                        <a href="#"
                            class="block px-4 py-3 text-pp-dark-blue hover:bg-pp-pale-grey hover:text-pp-teal transition-colors">Ongoing
                            Projects</a>
                        <a href="#"
                            class="block px-4 py-3 text-pp-dark-blue hover:bg-pp-pale-grey hover:text-pp-teal transition-colors">Contribute</a>
                    </div>
                </div>

                <!-- About Link -->
                <a href="{% url 'about:index' %}"
                    class="text-pp-dark-blue font-medium hover:text-pp-teal transition-colors">About</a>

                <!-- Cite Us Link -->
                <a href="{% url 'citation:index' %}"
                    class="text-pp-dark-blue font-medium hover:text-pp-teal transition-colors">Cite Us</a>
            </nav>

            <!-- Mobile Menu Button -->
            <div class="lg:hidden">
                <button class="text-pp-dark-blue focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </div>
        </nav>
</header>
