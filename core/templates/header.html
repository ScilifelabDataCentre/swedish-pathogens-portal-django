{% load static %}

<header class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
  <div class="container mx-auto  px4 lg:px-6 max-w-7xl">
    <div class="flex items-center justify-between h-20">

      <!-- Logos -->
      <div class="flex items-center gap-6">
        <a href="{% url 'home:index' %}" class="flex items-center">
          <img class="h-15 inline" src="{% static 'images/swe_pathogens_logo_transparent.svg' %}" alt="Swedish Pathogens Portal">
        </a>
        <div class="h-10 w-px bg-gray-300"></div>
        <a href="https://www.scilifelab.se/" target="_blank" rel="noopener" class="flex items-center">
          <img src="{% static 'images/SciLifeLab_logo.svg' %}" alt="SciLifeLab" class="h-10">
        </a>
      </div>

      <!-- Desktop Navigation -->
      <nav class="hidden lg:flex ml-auto items-center gap-6" aria-label="Main navigation">
        <!-- Research Data Management Dropdown (desktop hover) -->
        <div class="relative group">
          <button type="button"
                  class="flex items-center gap-1 text-pp-dark-blue font-medium hover:text-pp-teal transition-colors py-2">
            Research Data Management
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </button>

          <div class="absolute left-0 mt-2 w-56 bg-white border border-gray-200 rounded-lg shadow-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all">
            <a href="{% url 'data_management:index' %}" class="block px-4 py-3 text-pp-dark-blue hover:bg-pp-pale-grey hover:text-pp-teal transition-colors">Data management</a>
            <a href="{% url 'dashboards:index' %}" class="block px-4 py-3 text-pp-dark-blue hover:bg-pp-pale-grey hover:text-pp-teal transition-colors">Dashboards</a>
            <a href="{% url 'register_based_research:index' %}" class="block px-4 py-3 text-pp-dark-blue hover:bg-pp-pale-grey hover:text-pp-teal transition-colors">Register-based research</a>
            <a href="{% url 'news:index' %}" class="block px-4 py-3 text-pp-dark-blue hover:bg-pp-pale-grey hover:text-pp-teal transition-colors">News</a>
          </div>
        </div>

        <a href="{% url 'outbreaks:index' %}" class="text-pp-dark-blue px-3 font-medium hover:text-pp-teal transition-colors py-2">Outbreaks</a>
        <a href="{% url 'topics:index' %}" class="text-pp-dark-blue px-3 font-medium hover:text-pp-teal transition-colors py-2">Topics</a>
      </nav>

      <!-- Mobile Menu Button -->
      <div class="lg:hidden justify-end" >
        <button id="mobileMenuButton"
                type="button"
                class="text-pp-dark-blue focus:outline-none -mr-6 lg:mr-0 p-2"
                aria-expanded="false"
                aria-controls="mobileMenuPanel">
          <span class="sr-only">Open menu</span>
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile menu panel -->
  <div id="mobileMenuPanel" class="lg:hidden hidden border-t border-gray-200 bg-white">
    <div class="container mx-auto px-6 max-w-7xl py-4 space-y-2">

      <!-- Research Data Management (tap-to-open) -->
      <details class="group">
        <summary class="list-none cursor-pointer flex items-center justify-between rounded px-2 py-3 text-pp-dark-blue font-medium hover:bg-pp-pale-grey">
          <span>Research Data Management</span>
          <svg class="w-4 h-4 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </summary>

        <div class="mt-1 pl-2 border-l border-gray-200">
          <a href="{% url 'data_management:index' %}" class="block px-2 py-2 text-pp-dark-blue hover:text-pp-teal">Data management</a>
          <a href="{% url 'dashboards:index' %}" class="block px-2 py-2 text-pp-dark-blue hover:text-pp-teal">Dashboards</a>
          <a href="{% url 'register_based_research:index' %}" class="block px-2 py-2 text-pp-dark-blue hover:text-pp-teal">Register-based research</a>
          <a href="{% url 'news:index' %}" class="block px-2 py-2 text-pp-dark-blue hover:text-pp-teal">News</a>
        </div>
      </details>

      <a href="{% url 'outbreaks:index' %}" class="block rounded px-2 py-3 text-pp-dark-blue font-medium hover:bg-pp-pale-grey">Outbreaks</a>
      <a href="{% url 'topics:index' %}" class="block rounded px-2 py-3 text-pp-dark-blue font-medium hover:bg-pp-pale-grey">Topics</a>

    </div>
  </div>
</header>

<script>
  (function () {
    const btn = document.getElementById("mobileMenuButton");
    const panel = document.getElementById("mobileMenuPanel");
    if (!btn || !panel) return;

    function openMenu() {
      panel.classList.remove("hidden");
      btn.setAttribute("aria-expanded", "true");
    }

    function closeMenu() {
      panel.classList.add("hidden");
      btn.setAttribute("aria-expanded", "false");
      // Close any open <details> inside the panel
      panel.querySelectorAll("details[open]").forEach((d) => (d.open = false));
    }

    function toggleMenu() {
      const isHidden = panel.classList.contains("hidden");
      isHidden ? openMenu() : closeMenu();
    }

    btn.addEventListener("click", toggleMenu);

    // Close if you click outside the header (mobile only)
    document.addEventListener("pointerdown", (e) => {
      if (panel.classList.contains("hidden")) return;
      const header = btn.closest("header");
      if (header && !header.contains(e.target)) closeMenu();
    });

    // Close on Escape
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeMenu();
    });

    // Optional: close menu after clicking a link
    panel.querySelectorAll("a").forEach((a) => {
      a.addEventListener("click", closeMenu);
    });
  })();
</script>
