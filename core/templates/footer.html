{% load static %} 
<footer role="contentinfo" aria-label="Site footer"
        class="bg-gradient-to-br from-pp-dark-blue to-pp-mid-blue mt-16">
  <div class="container mx-auto px-6 max-w-7xl py-12">

    <!-- Main row: three columns (left / center / right) -->
    <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-8">

            <!-- Brand Column -->
            <div class="lg:col-span-1">
                <p class="text-white text-sm leading-relaxed mb-4">
                </p>
                

    <nav class="flex flex-wrap items-center space-x-6 text-sm " aria-label="Footer links">
        {% url 'about' as about_url %}
        <a href="{{ about_url|default:'/about/' }}" class="text-white  hover:underline focus:outline-none">About</a>
        {% url 'contact' as contact_url %}
        <a href="{{ contact_url|default:'/contact/' }}" class="text-white hover:underline focus:outline-none">Contact</a>
        {% url 'cite' as cite_url %}
        <a href="{{ cite_url|default:'/citation/' }}" class="text-white hover:underline focus:outline-none">Cite us</a>
        {% url 'privacy' as privacy_url %}
        <a href="{{ privacy_url|default:'/privacy/' }}" class="text-white hover:underline focus:outline-none">Privacy policy</a>
    </nav>
            </div>

            <!-- Social media column -->
            <div class="lg:col-span-1 justify-center">
                <div class="flex gap-3 justify-center-safe">
                    <a href="#"
                        class="text-white w-9 h-9 bg-white/10 hover:bg-pp-lime-green hover:text-pp-dark-blue rounded-lg flex items-center justify-center transition-all"
                        aria-label="Twitter">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M23 3a10.9 10.9 0 01-3.14 1.53 4.48 4.48 0 00-7.86 3v1A10.66 10.66 0 013 4s-4 9 5 13a11.64 11.64 0 01-7 2c9 5 20 0 20-11.5a4.5 4.5 0 00-.08-.83A7.72 7.72 0 0023 3z">
                            </path>
                        </svg>
                    </a>
                    <a href="#"
                        class="text-white w-9 h-9 bg-white/10 hover:bg-pp-lime-green hover:text-pp-dark-blue rounded-lg flex items-center justify-center transition-all"
                        aria-label="GitHub">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z">
                            </path>
                        </svg>
                    </a>
                    <a href="#"
                        class="text-white w-9 h-9 bg-white/10 hover:bg-pp-lime-green hover:text-pp-dark-blue rounded-lg flex items-center justify-center transition-all"
                        aria-label="LinkedIn">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z">
                            </path>
                        </svg>
                    </a>
                </div>
            </div> 

        <!-- Funders (right) -->
        <div class="mt-4 sm:mt-0 flex justify-end-safe">
            <div class="flex items-center space-x-4" aria-label="Funders">
                <!-- Host and partner logo -->
                <img src="{% static '/images/complete_funders_logo.svg' %}"
                    alt="SciLifeLab, Knut and Alice Wallenberg Foundation and SSF Logo"
                    class="h-15 sm:h-22 w-auto opacity-90 transition-opacity duration-150 hover:opacity-100">

        </div>
    </div>

</div>
  <!-- Small bottom row (copyright) -->
  <div class="max-w-7xl mx-auto px-4 py-2 border-t border-gray-100 text-xs text-gray-500">
    © {% now "Y" %} SciLifeLab DC
  </div>
</footer>
