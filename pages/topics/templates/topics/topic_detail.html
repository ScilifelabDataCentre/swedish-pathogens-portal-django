{% extends "base.html" %}
{% load static %}

{% block content %}
<!-- Main Content -->
    <h3>{{ topic.title }}</h3>
    <!-- Alert Message -->
    {% if topic.announcement %}
    <div class="alert alert-info bg-pp-teal/10 border border-pp-teal/20 text-pp-dark-blue p-4 rounded-lg mb-6">
        <div class="flex items-start">
            <svg class="w-5 h-5 mr-3 mt-0.5 shrink-0 text-pp-teal" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
            </svg>
            <span class="text-pp-dark-blue">
                <i class="italic">{{ topic.announcement }}</i>
            </span>
        </div>
    </div>
    {% endif %}

    <!-- Topic content (base.css typography applies to rendered elements) -->
    <div>
        {{ topic.rendered_content|safe }}
    </div>
{% endblock %}
