{% comment %}
    A common snippet that can be included in the template
    when plot html is not available

    Usage:
        {% include "dashboards/partials/plot_loading_error.html" %}
{% endcomment %}

<div class="my-6 min-h-30 bg-pp-pale-grey text-center content-center" role="alert">
    <span>
        Problem loading the plot, please try again later.<br>
        If the problem persists, <a href="{% url 'contact:index' %}">contact</a>
        the portal team.
    </span>
</div>
