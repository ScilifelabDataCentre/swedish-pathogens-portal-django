{% if resources %}
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 lg:gap-6">
        {% for resource in resources %}
            <div class="bg-white border border-pp-pale-grey rounded-lg shadow-sm hover:shadow-md transition-shadow duration-300">
                <div class="relative">
                    <img
                        src="{{ resource.display_image }}"
                        alt="{{ resource.name }}"
                        class="w-full h-48 object-cover rounded-t-lg"
                    />
                </div>
                <div class="p-4">
                    <h6 class="text-lg font-semibold mb-2">
                        <a
                            href="{{ resource.link }}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            {{ resource.name }}
                        </a>
                    </h6>
                    <p class="text-pp-dark-grey text-sm leading-relaxed mb-3">
                        {{ resource.description|truncatewords:25 }}
                    </p>
                    <div class="text-pp-dark-grey text-xs mb-2">
                        <span class="font-semibold">Data type:</span>
                        <span>{{ resource.data_type_display }}</span>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
{% else %}
    <div class="text-center py-16">
        <div class="max-w-md mx-auto">
            <div class="w-20 h-20 bg-pp-pale-grey rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-10 h-10 text-pp-dark-grey" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path>
                </svg>
            </div>
            <h3 class="text-xl font-semibold text-pp-dark-grey mb-2">{{ empty_title }}</h3>
            <p class="text-pp-dark-grey">
                {{ empty_message }}
            </p>
        </div>
    </div>
{% endif %}
