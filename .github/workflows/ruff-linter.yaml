# .github/workflows/ruff.yaml
# GitHub Actions workflow for Ruff linter
---
name: Ruff

on:
  push:
    paths:
      - '**.py'
  pull_request:
    paths:
      - '**.py'

jobs:
  ruff:
    name: Run checks with Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
      
      - name: Lint check
        uses: astral-sh/ruff-action@v3
        with:
          version: latest
          src: "./"
          args: check

      - name: Format check
        uses: astral-sh/ruff-action@v3
        with: 
          version: latest
          src: "./"
          args: format --check --diff